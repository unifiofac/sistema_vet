spring.application.name=vet-backend

# --- Servidor ---
# Hospedagens (Render, Railway, Fly...) informam a porta pela variável PORT
server.port=${PORT:8080}
# atrás do proxy da hospedagem, usa o IP real do cliente (limite de requisições)
server.forward-headers-strategy=native

# --- IA (Gemini) ---
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
gemini.model-reserva=${GEMINI_MODEL_RESERVA:}

# --- Segurança ---
# OBRIGATÓRIA: texto aleatório com pelo menos 32 caracteres (a aplicação não sobe sem ela)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:12}
# origens permitidas (URL do frontend), separadas por vírgula
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
# limites por IP, por minuto
app.limite.login-por-minuto=${LIMITE_LOGIN:10}
app.limite.ia-por-minuto=${LIMITE_IA:20}

# --- Primeiro acesso ---
# Se o banco estiver vazio, cria 1 veterinário com estes dados (depois pode remover as variáveis)
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}
# SEED_DEMO=true cria 3 usuários e 3 pacientes de exemplo (use SEED_SENHA como senha deles). Só para demonstração.
app.seed.demo=${SEED_DEMO:false}
app.seed.senha=${SEED_SENHA:}

# --- Banco de dados ---
# Padrão: H2 em arquivo local (data/vetdb). Em produção use PostgreSQL:
#   JDBC_DATABASE_URL=jdbc:postgresql://host:5432/banco  DB_USER=...  DB_PASSWORD=...
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/vetdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
