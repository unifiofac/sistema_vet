<div class="container">
  <div class="pet-card" style="max-width: 500px; margin: 0 auto;">
    <h2 class="card-title">Cadastro de paciente</h2>

    <div class="form-group">
      <input type="text" class="form-input" [(ngModel)]="nome" placeholder="Nome do animal">
    </div>
    <div class="form-group">
      <select class="form-select" [(ngModel)]="especie">
        <option value="">Espécie e raça</option>
        <option value="Cão - Corgi">Cão - Corgi</option>
        <option value="Cão - Labrador">Cão - Labrador</option>
        <option value="Cão - Poodle">Cão - Poodle</option>
        <option value="Cão - SRD">Cão - SRD</option>
        <option value="Gato - Persa">Gato - Persa</option>
        <option value="Gato - Siamês">Gato - Siamês</option>
        <option value="Gato - SRD">Gato - SRD</option>
      </select>
    </div>
    <div class="form-group">
      <input type="text" class="form-input" [(ngModel)]="idade" placeholder="Idade">
    </div>
    <div class="form-group">
      <select class="form-select" [(ngModel)]="sexo">
        <option value="">Sexo</option>
        <option value="Macho">Macho</option>
        <option value="Fêmea">Fêmea</option>
      </select>
    </div>
    <div class="form-group">
      <div class="upload-area" (click)="fotoInput.click()">
        <label class="upload-label">
          <i class="fas fa-camera"></i>
          <span>Upload de foto</span>
        </label>
        <input #fotoInput type="file" accept="image/*" style="display: none;" (change)="onFotoSelecionada($event)">
        <img *ngIf="imagePreview" [src]="imagePreview" style="display:block; margin-top:1rem; max-width:100%; height:150px; object-fit:cover; border-radius:0.5rem;" alt="Preview">
      </div>
    </div>
    <div class="form-group">
      <input type="text" class="form-input" [(ngModel)]="tutorNome" placeholder="Nome do tutor">
    </div>
    <div class="form-group">
      <input type="tel" class="form-input" [(ngModel)]="tutorContato" placeholder="Telefone do tutor">
    </div>
    <div class="form-group">
      <textarea class="form-textarea" [(ngModel)]="historicoMedico" placeholder="Histórico médico"></textarea>
    </div>
    <button class="btn-primary" (click)="cadastrar()">Cadastrar</button>
  </div>
</div>
